spring:
  application:
    name: kart-timing
  datasource:
    url: jdbc:postgresql://localhost:5434/karttiming
    username: kart
    password: kart
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8080

app:
  jwt:
    secret: ${APP_JWT_SECRET:change-me-to-a-long-secret-key-for-demo-only-32chars}
    expiration-ms: 86400000
  users:
    - username: admin
      password: $2a$10$cdKKYwW06.57iDHsLs5B/e.dKs0kgDiwW4LXn.1HSGABJMdKsxloi
      role: ADMIN

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [%X{requestId:-}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.pokemon.karttime: INFO
    org.springframework.security: WARN
