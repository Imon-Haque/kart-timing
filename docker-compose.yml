services:
  postgres:
    image: postgres:16-alpine
    container_name: kart-timing-db
    environment:
      POSTGRES_DB: karttiming
      POSTGRES_USER: kart
      POSTGRES_PASSWORD: kart
    ports:
      - "5434:5432"
    volumes:
      - kart_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kart -d karttiming"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: kart-timing-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/karttiming
      SPRING_DATASOURCE_USERNAME: kart
      SPRING_DATASOURCE_PASSWORD: kart
      APP_JWT_SECRET: change-me-to-a-long-secret-key-for-demo-only-32chars
    ports:
      - "8080:8080"

volumes:
  kart_pg_data:
